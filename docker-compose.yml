services:
  bot:
    build:
      context: .
      target: runtime
    container_name: jw_downloader_bot
    restart: always
    # Бот работает только на исходящих соединениях (long polling, без входящих
    # портов). Docker-NAT на этом хосте роняет крупные аплоады в Telegram:
    # путь до Telegram имеет MTU 1280, а ICMP «fragmentation needed» не
    # доставляется обратно в контейнер через NAT — отправка файлов >~1.5 МБ
    # висит и отваливается по таймауту. Сеть хоста тот же аплоад отдаёт за ~4с,
    # поэтому используем host-сеть напрямую и обходим проблему NAT целиком.
    network_mode: host
    env_file: .env
    volumes:
      - bot_data:/app/data
      # Только чтение: банка кук — мастер-копия боевых сессий. Загрузчик с
      # 62f7c30 работает с эфемерной копией, писать в мастер незачем, а любой
      # процесс в контейнере мог её перезаписать.
      - ./secrets:/app/secrets:ro
    tmpfs:
      - /tmp/jw_downloads:size=200M,mode=1777
    # Потолки обязательны: tmpfs под загрузки — это та же оперативная память,
    # а хост бот делит с другими сервисами. memswap_limit, равный mem_limit,
    # отключает своп: предсказуемый OOM одного контейнера лучше, чем
    # своп-трэшинг всей коробки. Пересмотреть в Task 14 плана local-bot-api,
    # когда загрузки уедут с tmpfs на диск.
    mem_limit: 1g
    memswap_limit: 1g
    pids_limit: 256
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  # Именованный том с базой. Docker наследует владельца из образа только при
  # ПЕРВОМ создании тома — это работает для новых развёртываний. Уже
  # существующий том остаётся во владении root, и непривилегированный
  # botuser (uid 1000, см. Dockerfile) не сможет в него писать. Перед первым
  # запуском этой версии образа на существующем томе выполнить разово:
  #   docker run --rm -v jw_downloader_bot_data:/data alpine chown -R 1000:1000 /data
  bot_data:
