services:
  bot:
    build:
      context: .
      target: runtime
    container_name: jw_downloader_bot
    restart: always
    # Бот работает только на исходящих соединениях (long polling, без входящих
    # портов). Docker-NAT на этом хосте роняет крупные аплоады в Telegram:
    # путь до Telegram имеет MTU 1280, а ICMP «fragmentation needed» не
    # доставляется обратно в контейнер через NAT — отправка файлов >~1.5 МБ
    # висит и отваливается по таймауту. Сеть хоста тот же аплоад отдаёт за ~4с,
    # поэтому используем host-сеть напрямую и обходим проблему NAT целиком.
    network_mode: host
    env_file: .env
    volumes:
      - bot_data:/app/data
      # Только чтение: банка кук — мастер-копия боевых сессий. Загрузчик с
      # 62f7c30 работает с эфемерной копией, писать в мастер незачем, а любой
      # процесс в контейнере мог её перезаписать.
      - ./secrets:/app/secrets:ro
      # Загрузки лежат на диске хоста (/mnt/storage, 1.3 ТБ свободно), а не в
      # оперативной памяти — Task 14 плана local-bot-api закрыт этим
      # переездом с tmpfs. Путь внутри контейнера тот же, что в
      # DOWNLOAD_ROOT (bot/config.py) и что ожидает telegram-bot-api.
      - /mnt/storage/jw_downloads:/srv/jw_downloads
    # Потолки обязательны независимо от того, что памяти лишку под загрузки
    # больше не выделено: хост делит память с другими сервисами. memswap_limit,
    # равный mem_limit, отключает своп: предсказуемый OOM одного контейнера
    # лучше, чем своп-трэшинг всей коробки. MAX_FILE_SIZE_MB в bot/config.py
    # (1500 МБ) больше не конфликтует с mem_limit ниже (1g = 1024 МиБ) — раньше
    # конфликтовал, потому что загрузки шли в tmpfs и потребляли именно эту
    # память; теперь они на диске и в этот лимит не упираются.
    mem_limit: 1g
    memswap_limit: 1g
    pids_limit: 256
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Свой Bot API-сервер: снимает облачный потолок 50 МБ на файл (см.
  # USE_LOCAL_BOT_API в bot/config.py). Сервис bot к нему НЕ привязан
  # (нет depends_on) — в облачном режиме бот не должен от него зависеть.
  telegram-bot-api:
    # :latest невоспроизводим: дайджест менялся без коммитов в апстриме.
    image: aiogram/telegram-bot-api:10.3
    container_name: jw_telegram_bot_api
    restart: always
    # Файлы в Telegram теперь заливает он, а Docker NAT на этом хосте роняет
    # аплоады больше ~1.5 МБ (path MTU 1280) — та же причина, что у bot.
    network_mode: host
    environment:
      # Ключи приложения с my.telegram.org, только из .env.
      TELEGRAM_API_ID: "${TELEGRAM_API_ID}"
      TELEGRAM_API_HASH: "${TELEGRAM_API_HASH}"
      # --local: файлы до 2000 МБ.
      TELEGRAM_LOCAL: "1"
      # Host-сеть, поэтому слушать только loopback.
      TELEGRAM_HTTP_IP_ADDRESS: "127.0.0.1"
      # Совпадает с TELEGRAM_API_BASE.
      TELEGRAM_HTTP_PORT: "8081"
      # Нет переменной, включающей стат-порт, и нет ports ниже: тот порт
      # отдаёт полный токен бота открытым текстом, а ?v= меняет verbosity —
      # не включать.
    volumes:
      # Внутри лежит папка, названная ПОЛНЫМ ТОКЕНОМ бота: каталог секретный,
      # вне репозитория, бэкапов и syncthing-папок jw_sync_*.
      - /mnt/storage/jw_tg_api/data:/var/lib/telegram-bot-api
      # multipart пишет тело запроса целиком в temp-dir; по умолчанию он в
      # слое контейнера на eMMC (свободно всего несколько ГБ).
      - /mnt/storage/jw_tg_api/temp:/tmp/telegram-bot-api
      # Каталог загрузок сюда НЕ монтируется: отдача идёт через multipart,
      # серверу эти файлы не нужны, а TDLib GC держим подальше от них.
    mem_limit: 512m
    memswap_limit: 512m
    pids_limit: 128
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Тестовый бот для смоука на отдельном токене, пока боевой бот остаётся на
  # облачном транспорте. Выключен по умолчанию (профиль smoke):
  #   docker compose --profile smoke up -d --build bot-smoke
  bot-smoke:
    profiles: ["smoke"]
    extends:
      service: bot
    container_name: jw_downloader_bot_smoke
    restart: "no"
    environment:
      # ":-", а не ":?": форма ":?" сломала бы любые compose-команды, если
      # переменной ещё нет в .env (до того как владелец заведёт тестового
      # бота). Боевой BOT_TOKEN сюда не подставляется.
      BOT_TOKEN: "${TEST_BOT_TOKEN:-}"
      USE_LOCAL_BOT_API: "true"
      MAX_FILE_SIZE_MB: "1500"
      # У админа в свежей тестовой базе нет подписки.
      FREE_DOWNLOADS_PER_DAY: "1000"
      # Вторая страховка от записи в боевую базу (первая — отдельный том ниже).
      DATABASE_URL: "sqlite+aiosqlite:///data/smoke.db"
    volumes:
      # При extends тома сливаются по целевому пути — эта строка заменяет
      # bot_data из наследуемого сервиса bot.
      - bot_smoke_data:/app/data

volumes:
  # Именованный том с базой. Docker наследует владельца из образа только при
  # ПЕРВОМ создании тома — это работает для новых развёртываний. Уже
  # существующий том остаётся во владении root, и непривилегированный
  # botuser (uid 1000, см. Dockerfile) не сможет в него писать. Перед первым
  # запуском этой версии образа на существующем томе выполнить разово:
  #   docker run --rm -v jw_downloader_bot_data:/data alpine chown -R 1000:1000 /data
  bot_data:
  # База смоук-бота (см. сервис bot-smoke) — отдельно от bot_data.
  bot_smoke_data:
